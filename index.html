<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Анализ поступления</title>
  <link rel="stylesheet" href="src/styles/main.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
</head>
<body>
  <header class="header">
    <h1>Анализ поступления</h1>
    <p>Командный кейс №3</p>
  </header>

  <main class="layout">
    <section class="controls card">
      <div class="row">
        <button id="generate-btn">Сгенерировать 16 списков</button>
        <button id="load-day-btn">Загрузить выбранный день в БД</button>
        <button id="clear-db-btn" class="danger">Очистить БД</button>
        <button id="report-btn" class="accent">PDF отчёт</button>
      </div>

      <div class="row">
        <label class="file">
          <input type="file" id="import-csv" accept=".csv">
          <span>Импорт CSV</span>
        </label>

        <label>День:
          <select id="day-select">
            <option value="2025-08-01">01.08</option>
            <option value="2025-08-02">02.08</option>
            <option value="2025-08-03">03.08</option>
            <option value="2025-08-04">04.08</option>
          </select>
        </label>

        <label>ОП:
          <select id="program-select">
            <option value="ALL">Все ОП</option>
            <option value="PM">ПМ</option>
            <option value="IVT">ИВТ</option>
            <option value="ITSS">ИТСС</option>
            <option value="IB">ИБ</option>
          </select>
        </label>

        <label>Согласие:
          <select id="consent-filter">
            <option value="all">Все</option>
            <option value="yes">Только с согласием</option>
            <option value="no">Только без согласия</option>
          </select>
        </label>

        <label>Поиск ID:
          <input id="search-id" type="text" placeholder="например 120045">
        </label>

        <label>Сортировка:
          <select id="sort-select">
            <option value="sum_desc">Сумма убыв.</option>
            <option value="sum_asc">Сумма возр.</option>
            <option value="id_asc">ID возр.</option>
          </select>
        </label>
      </div>

      <p id="status" class="status">Статус: готово</p>
    </section>

    <section class="grid">
      <section class="card">
        <h2>Текущий срез</h2>
        <div id="summary-cards" class="summary-cards"></div>
      </section>

      <section class="card">
        <h2>Список абитуриентов по ОП</h2>
        <div class="table-wrap big">
          <table id="program-table">
            <thead>
              <tr>
                <th>ID</th>
                <th>ОП</th>
                <th>Приоритет</th>
                <th>Согласие</th>
                <th>Физ/ИКТ</th>
                <th>Рус</th>
                <th>Мат</th>
                <th>ИД</th>
                <th>Сумма</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </section>

      <section class="card">
        <h2>Единый список (каскад приоритетов)</h2>
        <div class="table-wrap">
          <table id="cascade-table">
            <thead>
              <tr>
                <th>ID</th>
                <th>Согласие</th>
                <th>Сумма</th>
                <th>Приоритеты</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </section>
    </section>
  </main>

  <script src="src/js/generator.js"></script>
  <script src="src/js/db.js"></script>
  <script src="src/js/pdf.js"></script>
  <script src="src/js/main.js"></script>
</body>
</html>
